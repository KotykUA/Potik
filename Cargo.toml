[package]
name = "potik"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A GTK download manager powered by aria2"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
libc = "0.2"
ring = "0.17"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
